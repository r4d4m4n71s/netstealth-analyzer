[tool.poetry]
name = "netstealth-analyzer"
version = "2.0.0"
description = "Advanced log analyzer for network stealth operations with async support and plugin system"
authors = ["NetStealth Contributors <contributors@netstealth.com>"]
readme = "README.md"
license = "MIT"
homepage = "https://github.com/r4d4m4n71s/netstealth-analyzer"
repository = "https://github.com/r4d4m4n71s/netstealth-analyzer"
documentation = "https://netstealth-analyzer.readthedocs.io/"
keywords = ["security", "network", "stealth", "analysis", "proxy", "tls"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: System :: Networking",
    "Topic :: System :: Monitoring",
]
packages = [{include = "netstealth_analyzer", from = "src"}]

[tool.poetry.dependencies]
python = "^3.11"
pydantic = "^2.5"
aiofiles = "^23.2"
pyyaml = "^6.0"
jinja2 = "^3.1"
rich = "^13.7"
httpx = "^0.25"
asyncio-mqtt = "^0.16"
click = "^8.1"
tabulate = "^0.9"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4"
pytest-asyncio = "^0.21"
pytest-cov = "^4.1"
pytest-mock = "^3.12"
black = "^23.12"
ruff = "^0.1"
mypy = "^1.8"
pre-commit = "^3.6"
sphinx = "^7.2"
sphinx-rtd-theme = "^2.0"

[tool.poetry.group.test.dependencies]
coverage = "^7.3"
factory-boy = "^3.3"
freezegun = "^1.2"

[tool.poetry.scripts]
netstealth-analyze = "netstealth_analyzer.cli:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.ruff]
target-version = "py311"
line-length = 88
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "yaml.*",
    "tabulate.*",
    "rich.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers --strict-config"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
